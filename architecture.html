<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <title>ARCH · ревью архитектуры</title>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    window.__mermaid = mermaid;
    mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose" });
  </script>
  <style>
    :root {
      --bg: #14151c; --panel: #1e2030; --ink: #f3f4f8; --muted: #9aa0b4;
      --line: #2e3148; --accent: #5b6cff; --ok: #6bcb6b; --warn: #e6b84d; --bad: #e06c75;
      --chip: #2a2d44;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 "Fira Sans", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
    .brand { font-weight: 700; }
    .tabs button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--chip);
      color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    .tabs button.active, .btn-primary { background: var(--accent); border-color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .counts { display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
    .counts b { color: var(--ink); }
    .header-actions { display: flex; gap: 8px; flex: 0 0 auto; margin-left: auto; }
    .toast { position: fixed; right: 16px; bottom: 16px; z-index: 30; max-width: 36ch;
      padding: 10px 12px; background: var(--panel); color: var(--warn); border: 1px solid var(--line);
      border-radius: 10px; font-size: 13px; line-height: 1.35; box-shadow: 0 8px 28px rgba(0,0,0,.4); }
    .toast:not([hidden]) { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .site-link { color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: none; }
    .site-link:hover { color: var(--ink); }
    body.readonly details.edit,
    body.readonly #pane-q textarea,
    body.readonly #pane-q .row { display: none; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--line); }
    .filters select, .filters input { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 6px 10px; }
    main { padding: 16px 20px 64px; }
    .grid { display: grid; gap: 12px; }
    .split { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
    .nav { position: sticky; top: 76px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    @media (max-width: 900px) {
      .split { grid-template-columns: 1fr; }
      .nav { position: static; max-height: 28vh; overflow: auto; }
    }
    .nav button { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: transparent;
      border: 0; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
    .nav button.active { background: var(--accent); }
    .nav .lbl { color: var(--muted); font-size: 11px; padding: 8px 8px 4px; text-transform: uppercase; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .card h3 { margin: 0 0 8px; font-size: 16px; }
    .block-title { margin: 8px 0 4px; font-size: 18px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .chip { font-size: 12px; background: var(--chip); border-radius: 999px; padding: 3px 8px; color: var(--muted); }
    .chip.reality_check { color: #f0c674; }
    .chip.spec_gap { color: #8ab4f8; }
    .chip.contradiction { color: var(--bad); }
    .chip.closed, .chip.known { color: var(--ok); }
    .chip.partial { color: var(--warn); }
    .chip.tbd { color: #8ab4f8; }
    .chip.spec_only { color: #c9a0dc; }
    .cite { font-size: 12px; color: var(--muted); margin: 6px 0; }
    .claim, .ask { margin: 8px 0; }
    .claim span, .ask span { color: var(--muted); display: block; font-size: 12px; }
    .claim.answer { white-space: pre-wrap; }
    textarea, .who { width: 100%; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .row select { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
    .diag { background: #0f1118; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
    .diag-split { grid-template-columns: 268px minmax(0, 1fr); }
    .diag-split .nav { max-height: calc(100vh - 108px); overflow: auto; }
    .diag, #diag-view { min-width: 0; }
    .zoom-bar { display: flex; gap: 8px; align-items: center; margin: 8px 0 10px; }
    .zoom-bar button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--chip);
      color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .zoom-bar span { min-width: 4.2rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .diag-viewport { overflow: auto; min-width: 0; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: 10px; background: #0b0c12; }
    .diag-stage { transform-origin: 0 0; }
    .diag-stage svg { display: block; max-width: none !important; height: auto; }
    .sources { font-size: 13px; color: var(--muted); margin: 0 0 12px; max-width: 90ch; }
    .sources b { color: var(--ink); }
    .hidden { display: none; }
    .opts { margin: 6px 0; }
    .opts label { display: block; margin: 4px 0; color: var(--muted); cursor: pointer; }
    .intro { color: var(--muted); max-width: 90ch; }
    .from-general { margin: 0 0 10px; padding: 8px 10px; border-left: 2px solid var(--accent); }
    .from-general .lbl { margin: 0 0 4px; font-size: 12px; color: var(--accent); }
    .card h3 { color: #7dd3fc; }
    .what { color: #7dd3fc; margin: 0 0 10px; }
    .body { margin: 6px 0 4px; }
    .body h4 { margin: 12px 0 4px; font-size: 13px; font-weight: 650; color: var(--muted); letter-spacing: 0.01em; }
    .body h4.undef { color: #e06c75; }
    .body ul { margin: 4px 0 10px; padding-left: 20px; }
    .body li { margin: 3px 0; }
    .body p { margin: 6px 0; }
    details.edit { margin-top: 10px; }
    details.edit summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    details.edit textarea { margin-top: 8px; min-height: 12rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
<header>
  <div class="brand">Архитектура · канон, вопросы, схемы</div>
  <a class="site-link" id="link-trace" hidden href="index.html">Трассировка</a>
  <a class="site-link" id="link-tasks" hidden href="pm-tasks.html">Задачи</a>
  <div class="tabs">
    <button type="button" id="tab-c" class="active">Канон</button>
    <button type="button" id="tab-q">Вопросы</button>
    <button type="button" id="tab-d">Диаграммы</button>
  </div>
  <div class="counts" id="counts"></div>
  <div class="header-actions">
    <button class="btn" type="button" id="save">Сохранить правки</button>
    <button class="btn btn-primary" type="button" id="redraw">Обновить остальное</button>
    <button class="btn" type="button" id="export-xlsx" hidden>Выгрузить вопросы в Excel</button>
  </div>
</header>
<div id="toast" class="toast" hidden></div>
<div class="filters hidden" id="filters">
  <select id="f-kind"><option value="">все типы</option>
    <option value="reality_check">проверка реальности</option>
    <option value="spec_gap">пробел в доке</option>
    <option value="contradiction">противоречие</option>
  </select>
  <select id="f-status">
    <option value="open">открытые</option>
    <option value="all">включая закрытые</option>
    <option value="closed">только закрытые</option>
  </select>
</div>
<main>
  <div id="pane-c"></div>
  <div id="pane-q" class="grid hidden"></div>
  <div id="pane-d" class="hidden"></div>
</main>
<script>
let STATE = { questions: [], diagrams: [], job: {}, counts: {}, findings: { platform: [], agents: [] } };
let CANON_TARGET = "platform";
let DIAGRAM_TARGET = "AI-01";
let DIAGRAM_ZOOM = 1;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");

function statusRu(st) {
  return { known: "известно", partial: "частично", tbd: "открыто", spec_only: "только spec", contradiction: "спор" }[st] || st;
}
function kindLabel(k) {
  return { reality_check: "проверка реальности", spec_gap: "пробел в доке", contradiction: "противоречие" }[k] || k;
}
function qStatus(st) {
  return { open: "открыт", closed: "закрыт" }[st] || st;
}
const CANON_POINT = {
  2: "классы агентов",
  5: "где крутятся сервисы",
  7: "движок выполнения",
  8: "узлы задания",
  10: "инструменты агента",
  11: "проверка на входе",
  12: "вызов внешних систем",
  14: "связи и секреты",
  15: "очереди и потоки данных",
  17: "поиск фрагментов",
  18: "индекс эмбеддингов",
  19: "поля фрагмента",
  20: "нарезка документов",
  21: "словарь смыслов",
  22: "память разговора",
  23: "шапка спецификации",
  24: "насколько агент действует сам",
  25: "исследование",
  26: "ход рассуждения",
  27: "выбор модели",
  28: "что меняется без релиза",
  29: "предупреждения",
  30: "проверка качества",
  31: "способы проверки",
  32: "проверка на отказ",
  33: "правила и персональные данные",
  34: "уровень риска",
  35: "проверка человеком",
  36: "журнал вызовов",
  37: "метрики для аналитика",
  38: "контуры стендов",
  39: "версия агента",
  40: "повтор прогона",
  41: "реестр профилей",
};
function agentName(id) {
  const a = (STATE.findings.agents || []).find((x) => x.id === id);
  return a ? a.name : id;
}

function collectAnswers() {
  const items = {};
  document.querySelectorAll("#pane-q .card[data-id]").forEach((card) => {
    const ta = card.querySelector("textarea");
    const st = card.querySelector(".ans-st");
    if (!ta || !st) return;
    items[card.dataset.id] = {
      text: ta.value,
      status: st.value,
      by: card.querySelector(".who").value || "team",
    };
  });
  return items;
}

function collectFindings() {
  const platform = [];
  const seen = new Set();
  document.querySelectorAll("textarea[data-bind='platform']").forEach((ta) => {
    const id = ta.dataset.findingId;
    if (!id || seen.has(id)) return;
    seen.add(id);
    const st = ta.closest("article").querySelector("select.f-st[data-bind='platform']");
    const rec = { id, finding: ta.value };
    if (st) rec.status = st.value;
    platform.push(rec);
  });
  const agents = [];
  (STATE.findings.agents || []).forEach((ag) => {
    const items = [];
    document.querySelectorAll(`textarea[data-bind='agent'][data-agent='${ag.id}']`).forEach((ta) => {
      const st = ta.closest("article").querySelector("select.f-st[data-bind='agent']");
      const rec = { id: ta.dataset.findingId, finding: ta.value };
      if (st) rec.status = st.value;
      items.push(rec);
    });
    agents.push({ id: ag.id, items });
  });
  return { platform, agents };
}

function statusSelect(cur, bind) {
  const opts = ["known","partial","spec_only","tbd","contradiction"];
  return `<select class="f-st" data-bind="${bind || "platform"}">${opts.map((o) => `<option value="${o}" ${o===cur?"selected":""}>${statusRu(o)}</option>`).join("")}</select>`;
}

function formatBody(text) {
  const lines = String(text || "").split("\n");
  let html = "";
  let inUl = false;
  const close = () => { if (inUl) { html += "</ul>"; inUl = false; } };
  const li = (inner) => {
    if (!inUl) { html += "<ul>"; inUl = true; }
    html += `<li>${inner}</li>`;
  };
  for (const raw of lines) {
    const t = raw.replace(/\s+$/, "").trim();
    if (!t) { close(); continue; }
    if (/^Что описывает пункт:/.test(t)) {
      close();
      html += `<p class="what">${esc(t.replace(/^Что описывает пункт:\s*/, ""))}</p>`;
      continue;
    }
    const bullet = t.match(/^[-•]\s+(.*)$/);
    if (bullet) { li(esc(bullet[1])); continue; }
    if (/^[^:]{1,70}:$/.test(t)) {
      close();
      const title = t.slice(0, -1);
      const cls = title === "Не определено" ? " class=\"undef\"" : "";
      html += `<h4${cls}>${esc(title)}</h4>`;
      continue;
    }
    const colon = t.indexOf(":");
    if (colon > 0 && colon < 48 && t.slice(colon + 1).trim() && t.length < 240) {
      li(`<b>${esc(t.slice(0, colon))}</b>: ${esc(t.slice(colon + 1).trim())}`);
      continue;
    }
    close();
    html += `<p>${esc(t)}</p>`;
  }
  close();
  return html;
}

function findingCard(rec, scope, agentId, linkHtml) {
  const cites = (rec.citations || []).map((c) => `${(c.path || "").split("/").pop()}: ${c.note || ""}`).join("; ");
  const qs = (rec.question_ids || []).join(", ");
  const rows = Math.min(28, Math.max(10, String(rec.finding || "").split("\n").length + 1));
  return `<article class="card" data-finding-id="${esc(rec.id)}" data-scope="${scope}" data-agent="${esc(agentId || "")}">
    <h3>§${rec.n} · ${esc(rec.title)}</h3>
    <div class="chips">
      <span class="chip ${esc(rec.status)}">${statusRu(rec.status)}</span>
      ${qs ? `<span class="chip">вопросы ${esc(qs)}</span>` : `<span class="chip">без открытого вопроса</span>`}
    </div>
    ${cites ? `<p class="cite">${esc(cites)}</p>` : ""}
    ${linkHtml || ""}
    <div class="body">${formatBody(rec.finding)}</div>
    <details class="edit">
      <summary>править список</summary>
      <textarea data-bind="${scope}" data-finding-id="${esc(rec.id)}" ${agentId ? `data-agent="${esc(agentId)}"` : ""} rows="${rows}">${esc(rec.finding)}</textarea>
    </details>
    <div class="row">${statusSelect(rec.status, scope)}<span class="cite">список можно править, затем «Сохранить правки» или «Обновить остальное»</span></div>
  </article>`;
}

const AGENT_MARKS = {
  "AI-01": ["словарь смыслов", "семантик", "сервис wiki"],
  "AI-02": ["настройщик"],
  "AI-03": ["интегратор", "мастер интеграц"],
  "AI-04": ["импорт", "добавление документа"],
  "AI-05": ["переменн"],
  "AI-06": ["договор"],
  "AI-07": ["magic pad"],
  "AI-08": ["контрагент"],
  "AI-09": ["оркестратор", "ии на этапе"],
  "AI-10": ["поиск в шапке", "сервис поиска"],
  "AI-11": ["встреч"],
  "AI-12": ["динамический статус", "виджет статуса"],
  "AI-13": ["помощник"],
};

function bareLine(s) {
  return String(s || "")
    .replace(/\s*\([^)]*\)/g, " ")
    .replace(/ai-\d\d\s*[….–-]+\s*ai-\d\d/gi, " ")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

function subjectAgent(line) {
  const m = String(line || "").trim().match(/^(?:[-•]\s*)?(AI-\d\d)\b/i);
  return m ? m[1].toUpperCase() : null;
}

function lineAboutAgent(line, aid) {
  const sub = subjectAgent(line);
  if (sub) return sub === aid;
  const bare = bareLine(line);
  if (bare.includes(aid.toLowerCase())) return true;
  return (AGENT_MARKS[aid] || []).some((m) => bare.includes(m));
}

function alreadyOnCard(line, ownBare) {
  const payload = bareLine(line).replace(/^[-•]\s*/, "");
  const after = payload.includes(":") ? payload.slice(payload.indexOf(":") + 1).trim() : payload;
  if (after.length < 40 || ownBare.length < 40) return false;
  for (let i = 0; i + 40 <= after.length; i += 10) {
    if (ownBare.includes(after.slice(i, i + 40))) return true;
  }
  return false;
}

function sliceFromGeneral(text, aid, own) {
  const ownBare = bareLine(own);
  const kept = [];
  String(text || "").split("\n").forEach((raw) => {
    const t = raw.trim();
    if (!t || /^Что описывает пункт:/.test(t) || /^Не определено:?$/.test(t)) return;
    if (subjectAgent(t)) return;
    if (/^(?:[-•]\s*)?(Прочитать|Записать после|Найти|Выполнить|Сообщить человеку)\b/.test(t)) return;
    if (!lineAboutAgent(t, aid) || alreadyOnCard(t, ownBare)) return;
    kept.push(t.startsWith("-") || t.startsWith("•") ? t : `- ${t}`);
  });
  return kept.join("\n");
}

function renderCanon() {
  const f = STATE.findings || { platform: [], agents: [] };
  const navPlat = `<button type="button" data-go="platform" class="${CANON_TARGET==="platform"?"active":""}">Общая архитектура · §1–48</button>`;
  const navAg = (f.agents || []).map((a) =>
    `<button type="button" data-go="${a.id}" class="${CANON_TARGET===a.id?"active":""}">${a.id} ${a.name}</button>`
  ).join("");
  let body = "";
  if (CANON_TARGET === "platform") {
    body = `<h2 class="block-title">Общая архитектура</h2>
      <p class="intro">Содержание пункта: кто входит в каждый тип, и отдельно что не определено. Вопросы команде только там, где статус открыт или spec не равен стенду.</p>
      ${(f.platform || []).map((p) => findingCard(p, "platform")).join("")}`;
  } else {
    const ag = (f.agents || []).find((a) => a.id === CANON_TARGET);
    if (!ag) body = "<p>агент не найден</p>";
    else {
      const platByN = {};
      (f.platform || []).forEach((p) => { platByN[p.n] = p; });
      body = `<h2 class="block-title">${esc(ag.id)} · ${esc(ag.name)}</h2>
      <p class="intro">Чеклист этого агента. Если в общей архитектуре того же пункта есть строки про ${esc(ag.id)}, они показаны сверху. Остальной текст общего сюда не копируется. Kind: ${esc(ag.kind)}. Таксономия: ${esc((ag.taxonomy || []).join(", "))}${ag.taxonomy_note ? ". " + esc(ag.taxonomy_note) : ""}. Spec: ${esc(ag.spec)}.</p>
      ${(ag.items || []).map((it) => {
        const plat = platByN[it.n];
        const slice = plat ? sliceFromGeneral(plat.finding, ag.id, it.finding) : "";
        const link = slice ? `<div class="from-general"><p class="lbl">Из общего §${it.n}, только про этого агента</p><div class="body">${formatBody(slice)}</div></div>` : "";
        return findingCard(it, "agent", ag.id, link);
      }).join("")}`;
    }
  }
  $("pane-c").innerHTML = `<div class="split">
    <nav class="nav">
      <div class="lbl">общее</div>${navPlat}
      <div class="lbl">агенты</div>${navAg}
    </nav>
    <div class="grid" id="canon-body">${body}</div>
  </div>`;
  $("pane-c").querySelectorAll("details.edit textarea").forEach((ta) => {
    ta.addEventListener("input", () => {
      const article = ta.closest("article");
      const body = [...article.querySelectorAll(".body")].find((el) => !el.closest(".from-general"));
      if (body) body.innerHTML = formatBody(ta.value);
    });
  });
  $("pane-c").querySelectorAll(".nav button").forEach((b) => {
    b.onclick = () => {
      stashFindings();
      CANON_TARGET = b.dataset.go;
      renderCanon();
    };
  });
}

function stashAnswers() {
  const items = collectAnswers();
  (STATE.questions || []).forEach((q) => {
    const hit = items[q.id];
    if (!hit) return;
    q.answer_text = hit.text;
    q.answer_status = hit.status;
    q.answer_by = hit.by;
  });
}

function stashFindings() {
  const cur = collectFindings();
  (cur.platform || []).forEach((p) => {
    const dest = (STATE.findings.platform || []).find((x) => x.id === p.id);
    if (dest) { dest.finding = p.finding; dest.status = p.status; }
  });
  (cur.agents || []).forEach((ag) => {
    const dest = (STATE.findings.agents || []).find((x) => x.id === ag.id);
    if (!dest) return;
    (ag.items || []).forEach((it) => {
      const d = (dest.items || []).find((x) => x.id === it.id);
      if (d) { d.finding = it.finding; d.status = it.status; }
    });
  });
}

function sideNav(active, counts) {
  const mark = (n) => (counts && counts[n]) ? ` · ${counts[n]}` : "";
  const plat = `<button type="button" data-go="platform" class="${active==="platform"?"active":""}">Общая архитектура${mark("platform")}</button>`;
  const ag = (STATE.findings.agents || []).map((a) =>
    `<button type="button" data-go="${a.id}" class="${active===a.id?"active":""}">${esc(a.id)} ${esc(a.name)}${mark(a.id)}</button>`
  ).join("");
  return `<nav class="nav"><div class="lbl">общее</div>${plat}<div class="lbl">агенты</div>${ag}</nav>`;
}

function renderQuestions() {
  stashAnswers();
  const kind = $("f-kind").value;
  const stf = $("f-status").value;
  const buckets = { platform: [] };
  (STATE.findings.agents || []).forEach((a) => { buckets[a.id] = []; });
  (STATE.questions || []).forEach((q) => {
    const qs = q.status || "open";
    if (stf === "open" && qs !== "open") return;
    if (stf === "closed" && qs === "open") return;
    if (kind && q.kind !== kind) return;
    const key = q.scope === "agent" && q.agent_id && buckets[q.agent_id] ? q.agent_id : "platform";
    buckets[key].push(q);
  });
  Object.values(buckets).forEach((list) => list.sort((a, b) => (a.canon_section || 0) - (b.canon_section || 0) || String(a.id).localeCompare(String(b.id))));
  const counts = {};
  Object.keys(buckets).forEach((k) => { if (buckets[k].length) counts[k] = buckets[k].length; });
  if (!buckets[CANON_TARGET]) CANON_TARGET = "platform";
  const items = buckets[CANON_TARGET] || [];
  const ag = (STATE.findings.agents || []).find((a) => a.id === CANON_TARGET);
  const title = CANON_TARGET === "platform" ? "Общая архитектура" : `${ag.name}`;
  const intro = CANON_TARGET === "platform"
    ? "Вопросы к общей архитектуре. Слева то же переключение, что в каноне."
    : `Вопросы только по агенту «${ag.name}». Слева то же переключение, что в каноне.`;
  const cards = items.map((q) => {
    const qs = q.status || "open";
    const point = CANON_POINT[q.canon_section] || "";
    const opts = (q.options || []).map((o) => `<label><input type="radio" name="opt-${q.id}" value="${esc(o)}" ${q.answer_text===o?"checked":""}> ${esc(o)}</label>`).join("");
    return `<article class="card" data-id="${esc(q.id)}">
      <h3>${esc(q.title || q.id)}</h3>
      <div class="chips">
        <span class="chip ${esc(q.kind)}">${kindLabel(q.kind)}</span>
        <span class="chip">${q.scope === "agent" ? esc(agentName(q.agent_id)) : "общее"}</span>
        ${point ? `<span class="chip">канон: ${esc(point)}</span>` : ""}
        <span class="chip ${qs}">${qStatus(qs)}</span>
      </div>
      <p class="claim"><span>В документах</span>${esc(q.docs_claim || "")}</p>
      <p class="ask"><span>Уточнить у команды</span>${esc(q.ask_team || "")}</p>
      ${ON_PAGES ? (
        q.answer_text
          ? `<p class="claim answer"><span>${q.answer_status === "confirmed" ? "Ответ команды, подтверждён" : "Черновик ответа"}</span>${esc(q.answer_text)}</p>`
          : `<p class="cite">Ответа пока нет. Его пишут на локальной доске и выкладывают снимком.</p>`
      ) : `${opts ? `<div class="opts">${opts}</div>` : ""}
      <textarea rows="3" placeholder="черновик ответа">${esc(q.answer_text || "")}</textarea>
      <div class="row">
        <select class="ans-st">
          <option value="draft" ${q.answer_status==="confirmed"?"":"selected"}>черновик</option>
          <option value="confirmed" ${q.answer_status==="confirmed"?"selected":""}>подтверждён командой</option>
        </select>
        <input class="who" placeholder="кто отвечает" value="${esc(q.answer_by || "")}"/>
      </div>`}
    </article>`;
  }).join("");
  const empty = `<p class="intro">В этом блоке по текущему фильтру вопросов нет. Сверху можно сменить тип или показать закрытые.</p>`;
  $("pane-q").innerHTML = `<div class="split">
    ${sideNav(CANON_TARGET, counts)}
    <div class="grid">
      <h2 class="block-title">${esc(title)}</h2>
      <p class="intro">${esc(intro)}</p>
      ${ON_PAGES ? `<p class="intro">Ответы на этой странице не сохраняются. Кнопка «Выгрузить вопросы в Excel» в шапке скачивает файл. На листе карточки, как здесь: текст вопроса, варианты, поле ответа, статус и имя. Общая архитектура на своём листе, у каждого агента свой.</p>` : ""}
      ${cards || empty}
    </div>
  </div>`;
  $("pane-q").querySelectorAll(".nav button").forEach((b) => {
    b.onclick = () => { CANON_TARGET = b.dataset.go; renderQuestions(); };
  });
  $("pane-q").querySelectorAll(".card").forEach((div) => {
    div.querySelectorAll(".opts input").forEach((inp) => {
      inp.addEventListener("change", () => { if (inp.checked) div.querySelector("textarea").value = inp.value; });
    });
  });
}

const PLATFORM_ORDER = ["A","E","B","C","F","G","H","I","J","K","L","M"];

function svgPixelBox(svg) {
  const vb = svg.viewBox && svg.viewBox.baseVal;
  if (vb && vb.width > 0 && vb.height > 0) return { w: vb.width, h: vb.height };
  const box = svg.getBBox();
  return { w: box.width || 960, h: box.height || 480 };
}

function setDiagramZoom(next) {
  DIAGRAM_ZOOM = Math.min(4, Math.max(0.08, next));
  const stage = $("diag-stage");
  const label = $("zoom-label");
  if (!stage) return;
  const svg = stage.querySelector("svg");
  if (!svg) return;
  const box = svgPixelBox(svg);
  svg.style.width = box.w + "px";
  svg.style.height = box.h + "px";
  svg.style.maxWidth = "none";
  svg.style.transformOrigin = "0 0";
  svg.style.transform = `scale(${DIAGRAM_ZOOM})`;
  stage.style.width = Math.ceil(box.w * DIAGRAM_ZOOM) + "px";
  stage.style.height = Math.ceil(box.h * DIAGRAM_ZOOM) + "px";
  if (label) label.textContent = Math.round(DIAGRAM_ZOOM * 100) + "%";
}

function fitDiagram() {
  const viewport = $("diag-viewport");
  const svg = viewport && viewport.querySelector("svg");
  if (!viewport || !svg) return;
  const box = svgPixelBox(svg);
  const z = (viewport.clientWidth - 24) / box.w;
  setDiagramZoom(z);
}

function diagLabel(d) {
  if (d.layer === "agent") {
    const name = String(d.title || "").split("·").slice(1).join("·").trim();
    return name ? `${d.id} ${name}` : d.id;
  }
  const title = String(d.title || d.id).replace(/ Architecture$/, "");
  return `${d.id} · ${title}`;
}

async function renderDiagrams() {
  const pane = $("pane-d");
  const mermaid = window.__mermaid;
  const all = STATE.diagrams || [];
  const plat = PLATFORM_ORDER.map((id) => all.find((d) => d.id === id)).filter(Boolean);
  const restPlat = all.filter((d) => d.layer !== "agent" && d.id !== "D" && !PLATFORM_ORDER.includes(d.id));
  const overview = all.filter((d) => d.id === "D");
  const agents = all.filter((d) => d.layer === "agent");
  const groups = [
    ["Общая архитектура", plat.concat(restPlat)],
    ["Обзор", overview],
    ["Агенты", agents],
  ];
  const known = groups.flatMap(([, list]) => list);
  if (!known.some((d) => d.id === DIAGRAM_TARGET)) DIAGRAM_TARGET = (known[0] || {}).id || "";
  const nav = groups.map(([label, list]) => {
    if (!list.length) return "";
    const buttons = list.map((d) =>
      `<button type="button" data-go="${esc(d.id)}" class="${DIAGRAM_TARGET===d.id?"active":""}">${esc(diagLabel(d))}</button>`
    ).join("");
    return `<div class="lbl">${esc(label)}</div>${buttons}`;
  }).join("");
  const d = known.find((item) => item.id === DIAGRAM_TARGET);
  pane.innerHTML = `<div class="split diag-split">
    <nav class="nav">${nav}</nav>
    <div class="grid" id="diag-view"></div>
  </div>`;
  pane.querySelectorAll(".nav button").forEach((b) => {
    b.onclick = () => { DIAGRAM_TARGET = b.dataset.go; renderDiagrams(); };
  });
  const view = $("diag-view");
  if (!d) { view.textContent = "Схем пока нет."; return; }
  if (!mermaid) { view.textContent = "Mermaid ещё грузится, обновите вкладку."; return; }
  const wrap = document.createElement("section");
  wrap.className = "diag";
  const agentNote = d.layer === "agent"
    ? `<p class="intro">Круг это шаг агента, вилка это решение, знак &gt;_ это инструмент, значок пульса это запись в журнал. Каждая рамка стоит на стрелке того шага, где она срабатывает. Запрос клиента или системы стоит в начале хода.</p>`
    : "";
  wrap.innerHTML = `<h2>${esc(diagLabel(d))}</h2>${agentNote}
    <div class="zoom-bar">
      <button type="button" id="zoom-out" title="Дальше">−</button>
      <span id="zoom-label">100%</span>
      <button type="button" id="zoom-in" title="Ближе">+</button>
      <button type="button" id="zoom-fit">Вся схема</button>
    </div>
    <div class="diag-viewport" id="diag-viewport"><div class="diag-stage" id="diag-stage"></div></div>`;
  view.appendChild(wrap);
  try {
    const { svg } = await mermaid.render("m-" + d.stem + "-" + Date.now(), d.mermaid);
    $("diag-stage").innerHTML = svg;
    setDiagramZoom(DIAGRAM_ZOOM);
    $("zoom-in").onclick = () => setDiagramZoom(DIAGRAM_ZOOM * 1.25);
    $("zoom-out").onclick = () => setDiagramZoom(DIAGRAM_ZOOM / 1.25);
    $("zoom-fit").onclick = fitDiagram;
    $("diag-viewport").addEventListener("wheel", (ev) => {
      if (!ev.ctrlKey && !ev.metaKey) return;
      ev.preventDefault();
      setDiagramZoom(DIAGRAM_ZOOM * (ev.deltaY < 0 ? 1.1 : 0.9));
    }, { passive: false });
  } catch (e) {
    $("diag-stage").textContent = d.mermaid + "\n\n" + e;
  }
}

function paintMeta() {
  const c = STATE.counts || {};
  const plat = (STATE.findings.platform || []).length;
  const ag = (STATE.findings.agents || []).length;
  $("counts").innerHTML = `<span>открытых вопросов <b>${c.open || 0}</b></span>
    <span>пунктов канона <b>${plat}</b></span>
    <span>агентов <b>${ag}</b></span>`;
  const j = STATE.job || {};
  if (j.status && j.message) showToast(`${j.status}: ${j.message}`);
  const busy = j.status === "queued" || j.status === "running" || j.status === "awaiting_agent";
  $("redraw").disabled = busy;
  $("redraw").textContent = busy ? "Идёт critic…" : "Обновить остальное";
}

function crc32(data) {
  let c = ~0;
  for (let i = 0; i < data.length; i++) {
    c ^= data[i];
    for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xedb88320 & -(c & 1));
  }
  return ~c >>> 0;
}

function zipStore(files) {
  const enc = new TextEncoder();
  const locals = [];
  const centrals = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const data = f.data instanceof Uint8Array ? f.data : enc.encode(f.data);
    const crc = crc32(data);
    const local = new Uint8Array(30 + name.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(8, 0, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true);
    local.set(name, 30);
    locals.push(local, data);
    const central = new Uint8Array(46 + name.length);
    const cd = new DataView(central.buffer);
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.set(name, 46);
    centrals.push(central);
    offset += local.length + data.length;
  }
  const centralSize = centrals.reduce((n, b) => n + b.length, 0);
  const eocd = new Uint8Array(22);
  const ed = new DataView(eocd.buffer);
  ed.setUint32(0, 0x06054b50, true);
  ed.setUint16(8, files.length, true);
  ed.setUint16(10, files.length, true);
  ed.setUint32(12, centralSize, true);
  ed.setUint32(16, offset, true);
  return new Blob([...locals, ...centrals, eocd], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  });
}

function xlsxXml(s) {
  return String(s ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}

function xlsxCol(n) {
  let s = "";
  let x = n + 1;
  while (x) {
    const m = (x - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    x = Math.floor((x - 1) / 26);
  }
  return s;
}

function sheetTitle(raw, used) {
  let name = String(raw || "Лист").replace(/[\\/?*[\]:]/g, " ").replace(/\s+/g, " ").trim();
  if (name.length > 31) name = name.slice(0, 31).trim();
  if (!name) name = "Лист";
  let unique = name;
  let n = 2;
  while (used.has(unique)) {
    const suffix = ` ${n}`;
    unique = (name.slice(0, 31 - suffix.length) + suffix).trim();
    n += 1;
  }
  used.add(unique);
  return unique;
}


function xlsxCell(col, row, text, style) {
  const value = String(text ?? "");
  const space = value.length ? ' xml:space="preserve"' : "";
  return `<c r="${xlsxCol(col)}${row}" t="inlineStr" s="${style}"><is><t${space}>${xlsxXml(value)}</t></is></c>`;
}

function textHeight(text, min) {
  const lines = String(text || "").split("\n").reduce((n, line) => n + Math.max(1, Math.ceil(line.length / 78)), 0);
  return Math.min(120, Math.max(min, lines * 16));
}

function formSheet(questions) {
  const built = [];
  questions.forEach((q, index) => {
    if (index) built.push({ h: 18, cells: [] });
    const point = CANON_POINT[q.canon_section] || "";
    const meta = [
      kindLabel(q.kind),
      q.scope === "agent" ? agentName(q.agent_id) : "общее",
      point ? `канон: ${point}` : "",
      qStatus(q.status || "open"),
      q.id,
    ].filter(Boolean).join("   ·   ");
    built.push({ h: 28, cells: [{ c: 0, t: q.title || q.id, s: 1 }], span: [0, 2] });
    built.push({ h: 20, cells: [{ c: 0, t: meta, s: 4 }], span: [0, 2] });
    built.push({
      h: textHeight(q.docs_claim, 36),
      cells: [{ c: 0, t: "В документах", s: 2 }, { c: 1, t: q.docs_claim || "", s: 0 }],
      span: [1, 2],
    });
    built.push({
      h: textHeight(q.ask_team, 36),
      cells: [{ c: 0, t: "Уточнить у команды", s: 2 }, { c: 1, t: q.ask_team || "", s: 0 }],
      span: [1, 2],
    });
    const options = q.options || [];
    if (options.length) {
      built.push({
        h: 22,
        cells: [
          { c: 0, t: "Варианты", s: 2 },
          { c: 1, t: "Отметьте «да» у одного варианта. Свой текст можно дописать ниже.", s: 4 },
          { c: 2, t: "Отметка", s: 2 },
        ],
      });
      options.forEach((option) => {
        built.push({
          h: textHeight(option, 22),
          cells: [{ c: 1, t: option, s: 0 }, { c: 2, t: q.answer_text === option ? "да" : "", s: 3 }],
          yes: 2,
        });
      });
    }
    const status = q.answer_status === "confirmed" ? "подтверждён командой" : "черновик";
    built.push({
      h: textHeight(q.answer_text, 58),
      cells: [{ c: 0, t: "Черновик ответа", s: 2 }, { c: 1, t: q.answer_text || "", s: 3 }],
      span: [1, 2],
    });
    built.push({
      h: 24,
      cells: [{ c: 0, t: "Статус", s: 2 }, { c: 1, t: status, s: 3 }],
      status: true,
    });
    const who = q.answer_by && q.answer_by !== "team" ? q.answer_by : "";
    built.push({
      h: 24,
      cells: [{ c: 0, t: "Кто отвечает", s: 2 }, { c: 1, t: who, s: 3 }],
      span: [1, 2],
    });
  });
  const yesRefs = [];
  const statusRefs = [];
  const merges = [];
  const body = built.map((row, index) => {
    const r = index + 1;
    if (row.span) merges.push(`${xlsxCol(row.span[0])}${r}:${xlsxCol(row.span[1])}${r}`);
    if (row.yes != null) yesRefs.push(`${xlsxCol(row.yes)}${r}`);
    if (row.status) statusRefs.push(`B${r}`);
    const cells = (row.cells || []).map((cell) => xlsxCell(cell.c, r, cell.t, cell.s)).join("");
    return `<row r="${r}" ht="${row.h}" customHeight="1">${cells}</row>`;
  }).join("");
  const checks = [];
  const chunk = (refs, formula) => {
    for (let i = 0; i < refs.length; i += 16) {
      const sqref = refs.slice(i, i + 16).join(" ");
      checks.push(`<dataValidation type="list" allowBlank="1" showDropDown="0" sqref="${sqref}"><formula1>${formula}</formula1></dataValidation>`);
    }
  };
  chunk(yesRefs, "Lists!$B$1");
  chunk(statusRefs, "Lists!$A$1:$A$2");
  const dv = checks.length ? `<dataValidations count="${checks.length}">${checks.join("")}</dataValidations>` : "";
  const mergeXml = merges.length ? `<mergeCells count="${merges.length}">${merges.map((ref) => `<mergeCell ref="${ref}"/>`).join("")}</mergeCells>` : "";
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews>
  <cols>
    <col min="1" max="1" width="24" customWidth="1"/>
    <col min="2" max="2" width="88" customWidth="1"/>
    <col min="3" max="3" width="16" customWidth="1"/>
  </cols>
  <sheetData>${body}</sheetData>
  ${mergeXml}
  ${dv}
</worksheet>`;
}

function helpSheet() {
  const lines = [
    ["Как заполнять", 1],
    ["Каждый вопрос выглядит карточкой, как на сайте.", 0],
    ["Общая архитектура на своём листе. У каждого агента свой лист.", 0],
    ["У варианта поставьте «да» в колонке «Отметка», только у одного.", 0],
    ["Свой текст пишите в жёлтое поле «Черновик ответа».", 0],
    ["Статус выберите из списка: черновик или подтверждён командой.", 0],
    ["В поле «Кто отвечает» укажите имя.", 0],
    ["Код вопроса в серой строке под заголовком не меняйте.", 0],
    ["Закрытые вопросы в файл не входят.", 0],
    ["Пришлите файл Алексею Уколову. На сайте ответ сохранить нельзя.", 0],
  ];
  const body = lines.map(([text, style], index) => {
    const r = index + 1;
    return `<row r="${r}" ht="${index === 0 ? 28 : 22}" customHeight="1">${xlsxCell(0, r, text, style)}</row>`;
  }).join("");
  const merges = lines.map((_, index) => `<mergeCell ref="A${index + 1}:C${index + 1}"/>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews>
  <cols>
    <col min="1" max="1" width="24" customWidth="1"/>
    <col min="2" max="2" width="88" customWidth="1"/>
    <col min="3" max="3" width="16" customWidth="1"/>
  </cols>
  <sheetData>${body}</sheetData>
  <mergeCells count="${lines.length}">${merges}</mergeCells>
</worksheet>`;
}

function listsSheet() {
  const rows = [["черновик", "да"], ["подтверждён командой", ""]];
  const body = rows.map((pair, index) => {
    const r = index + 1;
    return `<row r="${r}">${xlsxCell(0, r, pair[0], 0)}${pair[1] ? xlsxCell(1, r, pair[1], 0) : ""}</row>`;
  }).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetData>${body}</sheetData>
</worksheet>`;
}

function questionsWorkbook() {
  const open = (STATE.questions || [])
    .filter((q) => (q.status || "open") === "open")
    .sort((a, b) => (a.canon_section || 0) - (b.canon_section || 0) || String(a.id).localeCompare(String(b.id)));
  const general = open.filter((q) => !(q.scope === "agent" && q.agent_id));
  const used = new Set();
  const sheets = [{ name: sheetTitle("Общая архитектура", used), xml: formSheet(general) }];
  (STATE.findings.agents || []).forEach((agent) => {
    const list = open.filter((q) => q.scope === "agent" && q.agent_id === agent.id);
    if (!list.length) return;
    sheets.push({ name: sheetTitle(`${agent.id} ${agent.name}`, used), xml: formSheet(list) });
  });
  const knownAgents = new Set((STATE.findings.agents || []).map((a) => a.id));
  const extra = new Map();
  open.filter((q) => q.scope === "agent" && q.agent_id && !knownAgents.has(q.agent_id)).forEach((q) => {
    if (!extra.has(q.agent_id)) extra.set(q.agent_id, []);
    extra.get(q.agent_id).push(q);
  });
  extra.forEach((list, id) => {
    sheets.push({ name: sheetTitle(id, used), xml: formSheet(list) });
  });
  sheets.push({ name: sheetTitle("Как заполнять", used), xml: helpSheet() });
  sheets.push({ name: sheetTitle("Lists", used), xml: listsSheet(), hidden: true });
  const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets>
    ${sheets.map((s, i) => `<sheet name="${xlsxXml(s.name).replaceAll('"', "&quot;")}" sheetId="${i + 1}" r:id="rId${i + 1}"${s.hidden ? ' state="hidden"' : ""}/>`).join("")}
  </sheets>
</workbook>`;
  const styleRid = sheets.length + 1;
  const wbRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  ${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}
  <Relationship Id="rId${styleRid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;
  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <fonts count="4">
    <font><sz val="12"/><color rgb="FF1F2430"/><name val="Calibri"/></font>
    <font><b/><sz val="16"/><color rgb="FF1F2430"/><name val="Calibri"/></font>
    <font><b/><sz val="11"/><color rgb="FF5C6378"/><name val="Calibri"/></font>
    <font><sz val="11"/><color rgb="FF5C6378"/><name val="Calibri"/></font>
  </fonts>
  <fills count="4">
    <fill><patternFill patternType="none"/></fill>
    <fill><patternFill patternType="gray125"/></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FFF4F5F8"/><bgColor indexed="64"/></patternFill></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FFFFF4CC"/><bgColor indexed="64"/></patternFill></fill>
  </fills>
  <borders count="2">
    <border><left/><right/><top/><bottom/></border>
    <border>
      <left style="thin"><color rgb="FFE4E7EE"/></left>
      <right style="thin"><color rgb="FFE4E7EE"/></right>
      <top style="thin"><color rgb="FFE4E7EE"/></top>
      <bottom style="thin"><color rgb="FFE4E7EE"/></bottom>
    </border>
  </borders>
  <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
  <cellXfs count="5">
    <xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>
    <xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment wrapText="1" vertical="center"/></xf>
    <xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>
    <xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>
    <xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment wrapText="1" vertical="center"/></xf>
  </cellXfs>
</styleSheet>`;
  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  ${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}
  <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`;
  return zipStore([
    { name: "[Content_Types].xml", data: types },
    { name: "_rels/.rels", data: rootRels },
    { name: "xl/workbook.xml", data: workbook },
    { name: "xl/_rels/workbook.xml.rels", data: wbRels },
    { name: "xl/styles.xml", data: styles },
    ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: s.xml })),
  ]);
}

let toastTimer = 0;
let toastSeen = "";
function showToast(text) {
  const msg = String(text || "").trim();
  if (!msg || msg === toastSeen) return;
  toastSeen = msg;
  const el = $("toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}

function downloadQuestionsXlsx() {
  const blob = questionsWorkbook();
  const day = new Date().toISOString().slice(0, 10);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `voprosy-arhitektura-${day}.xlsx`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const ON_PAGES = location.hostname.endsWith("github.io");

async function refresh() {
  const r = ON_PAGES
    ? await fetch(new URL("arch-state.json", location.href), { cache: "no-store" })
    : await fetch("/api/state", { cache: "no-store" });
  STATE = await r.json();
  if (!STATE.findings) STATE.findings = { platform: [], agents: [] };
  if (ON_PAGES) {
    document.body.classList.add("readonly");
    $("save").hidden = true;
    $("redraw").hidden = true;
    $("export-xlsx").hidden = false;
    $("link-trace").hidden = false;
    $("link-tasks").hidden = false;
  }
  paintMeta();
  if (ON_PAGES) showToast("Снимок для чтения. Правки остаются на локальной доске.");
  renderCanon();
  renderQuestions();
  if (!$("pane-d").classList.contains("hidden")) await renderDiagrams();
}

async function save() {
  await fetch("/api/answers", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items: collectAnswers(), by: "team" }),
  });
  await fetch("/api/findings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...collectFindings(), by: "team" }),
  });
  await refresh();
}

async function redraw() {
  $("redraw").disabled = true;
  await fetch("/api/findings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...collectFindings(), by: "team" }),
  });
  await fetch("/api/redraw", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items: collectAnswers(), by: "team" }),
  });
  await refresh();
  pollJob();
}

function pollJob() {
  const t = setInterval(async () => {
    const r = await fetch("/api/job", { cache: "no-store" });
    const j = await r.json();
    STATE.job = j;
    paintMeta();
    if (j.status === "done" || j.status === "error" || j.status === "idle") {
      clearInterval(t);
      await refresh();
    }
  }, 2000);
}

function showTab(name) {
  ["c", "q", "d"].forEach((t) => {
    $("tab-" + t).classList.toggle("active", t === name);
    $("pane-" + t).classList.toggle("hidden", t !== name);
  });
  $("filters").classList.toggle("hidden", name !== "q");
}
$("tab-c").onclick = () => { stashFindings(); showTab("c"); renderCanon(); };
$("tab-q").onclick = () => { stashAnswers(); showTab("q"); renderQuestions(); };
$("tab-d").onclick = async () => { showTab("d"); await renderDiagrams(); };
["f-kind", "f-status"].forEach((id) => $(id).addEventListener("input", renderQuestions));
$("save").onclick = save;
$("redraw").onclick = redraw;
$("export-xlsx").onclick = downloadQuestionsXlsx;
refresh();
</script>
