<script>
const SECTIONS = {"channel": "<h3>1. Канал (User Query)</h3>\n<table><thead><tr><th>Вход</th><th>Контекст вызова</th><th>Чего ждёт вызывающий</th><th>Статус</th></tr></thead><tbody><tr><td>A1: Magic Pad, явный вызов копилота без экземпляра (<code>/import</code>, файл в чат, «Импорт из файла»)</td><td>тенант, пользователь</td><td>вопрос в чате с ранжированными процессами, затем оверлей; итог по объектам в тот же чат</td><td>целевое (демо-версия есть)</td></tr><tr><td>A2: Magic Pad из открытого экземпляра</td><td>тенант, пользователь, экземпляр-родитель</td><td>то же + родительская связь без повторного вопроса</td><td>целевое</td></tr><tr><td>B: документ этапа, исполнитель этапа · AI-04</td><td>экземпляр, этап, настройки этапа (от среды BP)</td><td>результат на форме этапа; отдельного уведомления нет (FR-AI04-19)</td><td>целевое</td></tr></tbody></table>\n<ul>\n<li>Контракт входа: один файл (PDF, DOCX, XLSX, PNG, JPEG; <code>.jpg</code>/<code>.jpeg</code>), до 10 МБ, до 50 страниц OCR; необязательный сопроводительный текст с намерением («создай контрагента») · приоритетнее автоклассификации (FR-AI04-49).</li>\n<li>Отдельного вопроса «экземпляр или тенант» нет: контекст задаёт способ вызова (FR-AI04-46).</li>\n<li>Почта не самостоятельный вход (US-AI04-003). Пакетный импорт · вне объёма.</li>\n</ul>", "gateway": "<h3>2. Gateway и Auth</h3>\n<ul>\n<li><b>Gateway · BFF.</b> Принимает вызов канала, видит сессию и тенант, проксирует в сервисы. <b>есть</b></li>\n<li><b>Аутентификация</b> · Keycloak (OIDC) до BFF; агент личность не добывает. <b>есть</b></li>\n<li><b>Тенант и изоляция</b> · тенант и пользователь из доверенного контекста; задача импорта доступна только владельцу и его тенанту, одинаковый файл у двух тенантов не раскрывает чужой результат (NFR-AI04-9, AC-AI04-12/13). <b>целевое</b></li>\n<li><b>Входные правила до распознавания:</b> расширение и формат (ERR-FORMAT), размер (ERR-LIMIT-SIZE), страницы (ERR-LIMIT-PAGES), антивирус (FR-AI04-05), DLP (FR-AI04-42), проверка адреса файла на внутреннюю сеть и редиректы (NFR-AI04-10). Размер и расширение · <b>есть</b> в сервисе извлечения; остальное · <b>целевое</b>, сервисы антивируса и DLP · <b>TBD</b>.</li>\n<li><b>Авторизация на действия</b> · не в gateway: права BP (RM-3-001) проверяет Application Core до показа действия и повторно перед записью.</li>\n</ul>", "core": "<h3>3. Application Core</h3>\n<p>Хозяин данных · монолит BP (<code>new_arch</code>), вызывается через BFF. Агент в операционную базу не пишет.</p>\n<ul>\n<li><b>Параметры инициации</b> выбранного и зависимых процессов: <code>allow_on_init</code>, <code>is_required_on_init</code>, <code>default_value</code>, <code>validation_rules</code>; допустимые состояния, этапы, автосценарии (FR-AI04-47). <b>целевое</b> (чтение init-параметров на Dev · <b>есть</b>).</li>\n<li><b>Права</b> «Создание», «Смена этапа», «Добавление», изменение схемы процесса · отдельно по каждому объекту, повторно перед записью (FR-AI04-25). <b>целевое</b></li>\n<li><b>Запись комплекта</b> одним подтверждённым планом: основной и зависимые экземпляры, связи с ролями, материальный поток с N позициями, черновик по правилам процесса; итог по каждому объекту; повтор не создаёт дублей (FR-AI04-53, AC-AI04-10). Создание отдельных сущностей · <b>есть</b> в демо; план, черновик, позиции · <b>целевое</b>.</li>\n<li><b>Добавление поля в схему</b> через API монолита, затем перечитывание схемы (FR-AI04-57…61). <b>целевое</b></li>\n<li><b>Файловое хранилище BP</b> и временный URL на исходник. <b>целевое</b> (DEP: контракт хранилища).</li>\n<li>Блокер: модель позиций материального потока в бэке не построена · многострочный результат пока невозможен.</li>\n</ul>", "runtime": "<h3>4. Agent Pattern и runtime</h3>\n<ul>\n<li><b>Паттерн:</b> один runtime, один профиль «Импорт». Специализаций внутри нет, handoff нет. Владелец ответа · оверлей BP.</li>\n<li><b>Где выполняется.</b> Целевое: профиль на общем runtime агентов вне монолита; BP хранит каталог агентов и умеет их вызвать (решение ревью 03.08). Сейчас: шаги ведут фронт (оверлей) и BFF, сервис извлечения · отдельный узкий маппер «файл + схема → поля». <b>есть / целевое</b></li>\n<li><b>Таймауты и повторы:</b> время до оверлея ≤ 2 мин (NFR-AI04-1); вызовы модели и OCR · таймаут и один повтор с задержкой; запись в BP · идемпотентный повтор. Конкретные значения · <b>TBD</b>.</li>\n<li><b>Пауза на человеке:</b> задача импорта в статусе «Проверка в оверлее» хранит распознанные значения и план (FR-AI04-63). Где хранится задача · <b>TBD</b> (раздел 16).</li>\n<li><b>Отмена:</b> статус «Отменён», из неподтверждённого плана ничего не создаётся, временные файлы удаляются по политике хранения (FR-AI04-35/36). Истечение сессии в оверлее · незавершённое сопоставление не сохраняется (FR-AI04-37).</li>\n<li><b>Статусы задачи:</b> Загружен → Обработка → Готов к проверке → Проверка в оверлее → Подтверждён (процесс | wiki) → Завершён | Ошибка | Отменён.</li>\n</ul>\n<h3>5. Pipeline: шаги</h3>\n<p>Линейная цепочка, цикла нет. Единственный возврат · после «+ поле»: перечитать схему и повторно сопоставить одно значение без новой загрузки файла (FR-AI04-58); это повтор шага 4, а не цикл модели.</p>\n<table><thead><tr><th>#</th><th>Шаг</th><th>Что делает</th><th>Развилка / исход</th><th>Статус</th></tr></thead><tbody><tr><td>1</td><td>Приём</td><td>файл по ссылке + контекст запуска</td><td>·</td><td>есть</td></tr><tr><td>2</td><td>Входные правила</td><td>формат, лимиты, антивирус, DLP, адрес</td><td>нарушение → ошибка, распознавание не запускается</td><td>частично</td></tr><tr><td>3</td><td>Распознать</td><td>общий OCR-сервис: текст, координаты, таблицы</td><td>нечитаемый → ERR-IDP-READ, другой файл</td><td>есть внутри сервиса извлечения, вынос · целевое</td></tr><tr><td>4</td><td>Извлечь поля</td><td>схема процесса + подсказки W1 + правила клиента W2; позиции таблиц · отдельным вызовом</td><td>0 полей → предупреждение, поток идёт дальше</td><td>есть (без W2)</td></tr><tr><td>5</td><td>Ранжировать процессы</td><td>среди процессов тенанта по содержанию и покрытию полей</td><td>тип &lt; 0,70 или равные одноимённые → выбирает человек</td><td>частично</td></tr><tr><td>6</td><td>Участники и товары</td><td>поиск существующих экземпляров: ИНН · ключ контрагента; артикул, имя · товара</td><td>неоднозначно → «требует внимания»</td><td>частично (справочники)</td></tr><tr><td>7</td><td>Дубликат?</td><td>номер + дата + контрагент, не хэш файла</td><td>найден → открыть / создать недостающий / всё равно новый</td><td>целевое</td></tr><tr><td>8</td><td>Действие</td><td>однозначный prompt → сразу; иначе вопрос в чате</td><td>процесс · W2 · отмена</td><td>целевое</td></tr><tr><td>9</td><td>Оверлей</td><td>человек проверяет и подтверждает (раздел 8)</td><td>отмена → ничего не создано</td><td>частично</td></tr><tr><td>10</td><td>Запись и итог</td><td>проверка параметров и прав, запись плана, итог по объектам (U4)</td><td>частичный результат не маскируется</td><td>целевое</td></tr></tbody></table>\n<h3>6. Reasoning и выбор модели</h3>\n<ul>\n<li><b>Решает модель:</b> значения полей и позиций, тип документа и ранжирование процессов, имя экземпляра, есть ли значение в документе (проверка «+ поле»).</li>\n<li><b>Решает код:</b> пороги, дубликаты, права, параметры инициации, маршрут шагов, формат ответа. LLM-планера нет.</li>\n<li><b>Модели.</b> Сейчас одна модель на все шаги, temperature 0, ответ строго JSON. <b>есть</b> Целевое: вызовы через общий шлюз моделей платформы · сервис-прокси с единым API к провайдерам, ключами, лимитами и учётом стоимости. Какой сервис · <b>TBD</b>.</li>\n<li><b>Правило эскалации (Router):</b></li>\n</ul>\n<p>  - уверенность типа &lt; 0,70 или разрыв первого и второго кандидата &lt; 0,10 → процесс выбирает человек (FR-AI04-15/51);</p>\n<p>  - уверенность поля &lt; 0,70 (распознавание или сопоставление) → обязательная правка;</p>\n<p>  - сильная модель · опция: один повторный прогон только неуверенных полей, включается по результатам eval, не по умолчанию. <b>TBD</b></p>\n<p>  - Порог 0,70 и разрыв 0,10 · рабочие до калибровки. <b>TBD</b></p>\n<ul>\n<li><b>Контекст:</b> до 50 страниц; в модель идут текст документа, таблицы и узкий пакет полей выбранного процесса, не весь архив. Длинные таблицы · порциями строк. Размер порции · <b>TBD</b>.</li>\n</ul>", "tools": "<h3>7. Tool Execution</h3>\n<p>Протокол · REST через BFF. MCP не используется. Модель инструменты не выбирает: вызовы задаёт код профиля, поэтому вызов вне списка невозможен по построению. Формальный allowlist runtime · FR-AI04-55/56, следующий срез. Ответ модели проходит фильтр (JSON-схема, типы полей) до показа человеку.</p>\n<table><thead><tr><th>Инструмент</th><th>Класс</th><th>Хозяин данных</th><th>Когда</th><th>Пауза на человеке</th></tr></thead><tbody><tr><td><code>ocr.extract</code></td><td>чтение</td><td>OCR-сервис</td><td>шаг 3</td><td>нет</td></tr><tr><td><code>import.analyze</code></td><td>чтение</td><td>сервис извлечения</td><td>шаги 4–5</td><td>нет</td></tr><tr><td><code>import.verify</code></td><td>чтение</td><td>сервис извлечения</td><td>«+ поле»</td><td>нет</td></tr><tr><td><code>semantic.w1.read</code></td><td>чтение</td><td>вики платформы</td><td>шаги 4–5</td><td>нет</td></tr><tr><td><code>semantic.w2.read</code></td><td>чтение</td><td>вики тенанта</td><td>шаги 4–5</td><td>нет</td></tr><tr><td><code>bp.init_parameters</code></td><td>чтение</td><td>BP</td><td>шаги 4, 10</td><td>нет</td></tr><tr><td><code>bp.instances.search</code></td><td>поиск</td><td>BP</td><td>шаги 6–7</td><td>нет</td></tr><tr><td><code>bp.rights.check</code></td><td>чтение</td><td>BP</td><td>шаги 8, 10</td><td>нет</td></tr><tr><td><code>bp.import.commit</code></td><td>запись</td><td>BP</td><td>шаг 10</td><td>да, одно подтверждение комплекта</td></tr><tr><td><code>bp.field.add</code></td><td>запись</td><td>BP</td><td>«+ поле»</td><td>да, отдельное подтверждение</td></tr><tr><td><code>w2.index</code></td><td>запись</td><td>вики тенанта</td><td>ветка W2</td><td>да</td></tr></tbody></table>", "hv": "<h3>8. Human Validation</h3>\n<ul>\n<li><b>Где пауза:</b> между сборкой плана и записью · на ребре к побочному эффекту.</li>\n<li><b>Что видит человек:</b> документ слева, поля справа с уверенностью распознавания и сопоставления; шаги «Общие данные», «Документ», «Контрагенты», «Товары» · только если данные есть.</li>\n<li><b>Обязан поправить:</b> поле или тип ниже 0,70; неоднозначное сопоставление; недостающие обязательные параметры.</li>\n<li><b>Поле вне схемы</b> · отдельное состояние, не порог. «+ поле» доступно при праве изменять процесс; значение проверяется по документу, при неудаче · выделение фрагмента и повторный OCR; своё подтверждение (FR-AI04-57).</li>\n<li><b>Подтверждает одним действием</b> весь комплект: состав, состояния, этапы, связи, влияние автосценариев (FR-AI04-45).</li>\n<li><b>Права</b> проверяются до показа действия и повторно на сервере; недоступное действие показано с причиной.</li>\n<li><b>Отмена</b> · ничего не создано; ранее подтверждённое добавление поля не откатывается.</li>\n<li><b>После записи</b> · итог по объектам (U4); частичная запись не показывается общим успехом.</li>\n</ul>", "stress": "<h3>9. Stress testing и входные правила</h3>\n<table><thead><tr><th>Сценарий</th><th>Ожидаемое поведение</th><th>Статус</th></tr></thead><tbody><tr><td>Файл &gt; 10 МБ, &gt; 50 страниц, <code>.xls</code></td><td>отказ до распознавания с понятной ошибкой</td><td>частично</td></tr><tr><td>Вредоносный файл</td><td>антивирус до OCR, файл не обрабатывается</td><td>целевое</td></tr><tr><td>Утечка чувствительных данных</td><td>DLP до распознавания</td><td>целевое, TBD сервис</td></tr><tr><td>Адрес файла во внутреннюю сеть, редиректы</td><td>запрос отклонён</td><td>целевое</td></tr><tr><td>Нечитаемый скан</td><td>ERR-IDP-READ, запрос другого файла, без записи</td><td>частично</td></tr><tr><td>Prompt injection в тексте документа</td><td>текст идёт в промпт только как данные; модель не выбирает инструменты и не пишет в BP</td><td>есть по построению</td></tr><tr><td>Один файл дважды одновременно</td><td>один прогон, второй ждёт его результат</td><td>есть в пределах одного экземпляра сервиса</td></tr><tr><td>Два тенанта с одним файлом</td><td>ни кэш, ни результат не пересекаются</td><td>целевое</td></tr><tr><td>Таймаут модели или OCR</td><td>один повтор, затем понятная ошибка, файл не теряется</td><td>TBD значения</td></tr><tr><td>Лимит запросов провайдера (429)</td><td>повтор с задержкой через шлюз моделей</td><td>TBD</td></tr><tr><td>BFF или монолит недоступен при записи</td><td>результат распознавания сохранён, повтор без дублей (ERR-BFF)</td><td>целевое</td></tr><tr><td>Частичная запись комплекта</td><td>итог по объектам, общего успеха нет</td><td>целевое</td></tr><tr><td>Документ на 50 страниц с широкой таблицей</td><td>позиции порциями, ни одна строка не теряется (AC-AI04-14)</td><td>TBD</td></tr><tr><td>Параллельные импорты в тенанте</td><td>время до оверлея ≤ 2 мин p95 при N одновременных задачах</td><td>TBD цифра N</td></tr></tbody></table>", "data_processing": "<h3>10. Data Processing</h3>\n<ul>\n<li><b>Распознавание · отдельный общий OCR-сервис</b> для импорта, договора и индексации W2. Парсер текстового слоя (PDF, DOCX, XLSX), OCR сканов (PNG, JPEG, PDF-скан), layout: страница, координаты слов, ячейки таблиц. Выход · текст + координаты + таблицы; координаты нужны для подсветки источника поля и проверки «+ поле». Сейчас OCR встроен в сервис извлечения как временное решение. <b>целевое</b></li>\n<li>Временные файлы распознавания удаляются по политике хранения (FR-AI04-36, NFR-AI04-8). <b>TBD</b> сроки.</li>\n<li><b>Ветка W2</b> (контур семантического слоя): импорт передаёт документ, MD-описание и метаданные (задача-источник, раздел, автор, дата, тип); нарезку, эмбеддинги и индекс делает контур W2. Только по выбору «Сохранить в базу знаний», экземпляр не создаётся (FR-AI04-30…34). <b>целевое</b></li>\n</ul>", "database": "<h3>11. Database Layer</h3>\n<table><thead><tr><th>Хранилище</th><th>Что лежит</th><th>Хозяин</th><th>Читает</th><th>Пишет</th></tr></thead><tbody><tr><td>БД процесса (<code>new_arch</code>)</td><td>экземпляры, поля, схемы, связи, права</td><td>BP</td><td>импорт через BFF</td><td>BP после подтверждения</td></tr><tr><td>Файлы BP</td><td>исходный документ</td><td>BP</td><td>OCR-сервис по временному URL</td><td>BP при загрузке</td></tr><tr><td>Задача импорта</td><td>статус, владелец, тенант, план, итог, версии</td><td>runtime агентов, <b>TBD</b></td><td>оверлей, BFF</td><td>runtime</td></tr><tr><td>W1 · вики платформы</td><td>как устроен BP: типы документов, поля, процессы, роли</td><td>семантический слой</td><td>импорт</td><td>семантический слой</td></tr><tr><td>W2 · вики тенанта</td><td>правила и логика клиента; индекс документов</td><td>семантический слой</td><td>импорт</td><td>семантический слой; импорт · ветка W2</td></tr><tr><td>Трассы (Langfuse)</td><td>трассы и оценки</td><td>наблюдаемость</td><td>eval</td><td>runtime</td></tr></tbody></table>\n<p>Векторный движок W2 не выбран. Кэш распознавания, если нужен, · внутренняя оптимизация OCR-сервиса только в пределах тенанта.</p>", "evaluation": "<h3>12. Evaluation</h3>\n<p>Офлайн, не шаг цепочки.</p>\n<table><thead><tr><th>Метрика</th><th>Порог</th><th>Источник</th></tr></thead><tbody><tr><td>F1 полей на эталонном наборе</td><td>≥ 85%</td><td>NFR-AI04-2</td></tr><tr><td>Top-1 типа документа</td><td>≥ 80%</td><td>NFR-AI04-4</td></tr><tr><td>Доля полей без правки</td><td>≥ 50%</td><td>NFR-AI04-3</td></tr><tr><td>Время до оверлея</td><td>≤ 2 мин</td><td>NFR-AI04-1</td></tr></tbody></table>\n<ul>\n<li><b>Наборы:</b> EVAL-04-01…11 (счёт PDF, спецификация XLSX, плохой скан, поле вне схемы, матрица форматов, полнота полей, вложенный импорт, основной и зависимые типы, УПД с широкой таблицей, allowlist, новое против существующего). Хранятся как датасеты Langfuse. Сейчас наборов нет. <b>TBD</b></li>\n<li><b>Разметка из HITL:</b> по каждому полю сравнивается предложенное и подтверждённое значение · отсюда доля без правки и F1 на живых данных.</li>\n<li><b>Когда гоняем:</b> при смене промпта, модели, пакета семантики или OCR · прогон набора до выката, решение о выкате принимает человек.</li>\n<li><b>Чем судим:</b> точным сравнением с эталоном; модель-судья для значений полей не нужна.</li>\n</ul>", "logs": "<h3>13. Логи и наблюдаемость</h3>\n<p>Трасса на каждую задачу импорта. <b>есть</b> (базовая), поля ниже · <b>целевое</b> (FR-AI04-40).</p>\n<ul>\n<li><b>Спаны:</b> ocr, extract, classify, match, verify, commit.</li>\n<li><b>Поля трассы:</b> <code>trace_id</code>, id задачи, тенант и пользователь (хэш), процесс, <code>import_fork</code> (process | wiki), <code>semantic_pack_id</code> (версии W1 и W2), версия промпта, модель, уверенность по каждому полю (распознавание и сопоставление), число полей «требует внимания», правки человека по полям, время шагов, токены, стоимость.</li>\n<li><b>ПДн</b> в трассе маскируются (FR-AI04-39).</li>\n<li><b>Аудит подтверждения</b> (кто, когда, какой комплект) · журнал аудита BP (FR-AI04-28); Langfuse его не заменяет.</li>\n</ul>"};
const svg = document.querySelector('.board svg');
const panel = document.getElementById('panel');
const idle = panel.innerHTML;
svg.querySelectorAll('.blk').forEach(g => {
  g.addEventListener('mouseenter', () => {
    const id = g.dataset.block;
    svg.classList.add('focus');
    svg.querySelectorAll('.blk').forEach(b => b.classList.toggle('on', b.dataset.block === id));
    svg.querySelectorAll('.edge').forEach(e => {
      const on = e.dataset.a === id || e.dataset.b === id;
      e.classList.toggle('on', on);
      if (on) svg.querySelectorAll('.blk').forEach(b => { if (b.dataset.block === e.dataset.a || b.dataset.block === e.dataset.b) b.classList.add('on'); });
    });
    panel.innerHTML = SECTIONS[id] || idle;
  });
});
svg.addEventListener('mouseleave', () => {
  svg.classList.remove('focus');
  svg.querySelectorAll('.on').forEach(e => e.classList.remove('on'));
  panel.innerHTML = idle;
});
</script></body></html>
