13" stroke-width="4" paint-order="stroke"><tspan x="337.6" dy="0">атаки на вход</tspan></text></g><g class="edge" data-a="tools" data-b="data_processing"><path d="M515.4,569.5 L515.4,585.5 L154.0,585.5 L154.0,631.5" fill="none" stroke="#cfd4df" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="334.7" y="581.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#939bad" text-anchor="middle" stroke="#0c0e13" stroke-width="4" paint-order="stroke"><tspan x="334.7" dy="0">POST /v1/context/resolve</tspan></text></g><g class="edge" data-a="tools" data-b="database"><path d="M1012.0,569.5 L1012.0,631.5" fill="none" stroke="#cfd4df" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="1018.0" y="604.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#939bad" text-anchor="start" stroke="#0c0e13" stroke-width="4" paint-order="stroke"><tspan x="1018.0" dy="0">чтение</tspan></text></g><text x="24.0" y="850.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="24.0" dy="0">Не применяется:</tspan></text><g id="gateway" class="blk" data-block="gateway"><rect x="132.5" y="833.0" width="352.3" height="24" rx="6" fill="none" stroke="#4fa8e0" stroke-opacity="0.7" stroke-dasharray="4 3"/><text x="142.5" y="849.0" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="500" fill="#4fa8e0" text-anchor="start" letter-spacing="0.6"><tspan x="142.5" dy="0">GATEWAY</tspan></text><text x="198.8" y="849.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="198.8" dy="0">на листе карты полей отдельный шлюз не назван</tspan></text></g><g id="core" class="blk" data-block="core"><rect x="496.8" y="833.0" width="402.4" height="24" rx="6" fill="none" stroke="#8fb0d4" stroke-opacity="0.7" stroke-dasharray="4 3"/><text x="506.8" y="849.0" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="500" fill="#8fb0d4" text-anchor="start" letter-spacing="0.6"><tspan x="506.8" dy="0">APPLICATION CORE</tspan></text><text x="625.2" y="849.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="625.2" dy="0">карта поля читает и сама в процесс не пишет</tspan></text></g><path d="M24,893.0 h40" stroke="#cfd4df" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="74.0" y="897.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="74.0" dy="0">рабочий поток</tspan></text><path d="M179.89999999999998,893.0 h40" stroke="#3fbcb0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-trace)"/><text x="229.9" y="897.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="229.9" dy="0">след, обратная связь</tspan></text><path d="M379.9,893.0 h40" stroke="#e0585d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-attack)"/><text x="429.9" y="897.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="429.9" dy="0">атака, входные правила</tspan></text><circle cx="601.5" cy="893.0" r="9" fill="#0c0e13" stroke="#cfd4df" stroke-width="1.5"/><text x="618.5" y="897.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="618.5" dy="0">шаг</tspan></text><rect x="663.4" y="887.0" width="3.5" height="12" fill="#d9ab45"/><rect x="669.9" y="887.0" width="3.5" height="12" fill="#d9ab45"/><text x="683.4" y="897.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="683.4" dy="0">пауза перед побочным эффектом</tspan></text><text x="890.0999999999999" y="897.0" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#3fbcb0">&gt;_</text><text x="912.1" y="897.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="912.1" dy="0">инструмент</tspan></text><path d="M999.0999999999999,886.0 a10,4 0 0,0 20,0 v13 a10,4 0 0,1 -20,0 z" fill="none" stroke="#c65aa0" stroke-width="1.3"/><ellipse cx="1009.0999999999999" cy="886.0" rx="10" ry="4" fill="none" stroke="#c65aa0" stroke-width="1.3"/><text x="1027.1" y="897.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="1027.1" dy="0">хранилище</tspan></text><text x="24.0" y="931.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#e7e9ef" text-anchor="start"><tspan x="24.0" dy="0">Паттерн: линейная выдача схемы, промпта и модели нет</tspan></text><text x="24.0" y="952.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="24.0" dy="0">Отвергнуто: прямой SQL от модели и запись полей самой картой</tspan></text><text x="24.0" y="970.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="24.0" dy="0">Источники: текущий лист канона, agent_notation.py AI-05</tspan></text><text x="1696.0" y="970.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="end"><tspan x="1696.0" dy="0">AI-05 · Переменное окружение · версия 0.1-v2</tspan></text></svg></div>
<div class="panel" id="panel"><span class="hint">Наведите на блок схемы: подсветятся его связи, здесь появится описание блока из md.</span></div>
</div>
<script>
const SECTIONS = {"channel": "<h3>1. Канал (User Query)</h3>\n<p>Входы взяты с текущего листа и подписаны как на нём. Чего лист не называет, на схеме нет. Возврат ответа подписан так, как лист описывает канал этого агента, без добавленного маршрута.</p>", "gateway": "<h3>2. Gateway и Auth</h3>\n<p>Если на листе агента шлюз не назван, блок закрыт причиной и на рисунке его нет. Платформенный вход из общего канона на этот пробный лист не копировался, чтобы не дорисовать стрелку.</p>", "core": "<h3>3. Application Core</h3>\n<p>Кто хранит запись, взято с листа. Если агент в операционную базу не пишет, блок закрыт этой причиной, а не выдуманной записью.</p>", "runtime": "<h3>4. Agent Pattern и runtime</h3>\n<p>линейная выдача схемы, промпта и модели нет. Владелец ответа пользователю: JSON уходит в профиль, который пишет. Карта сама не заполняет.</p>\n<h3>5. Pipeline: шаги</h3>\n<p>Шаги листа, в том же составе: Собрать схему, Убрать поля вне прав, Подписи из словаря, Отдать JSON. Линейность или цикл заданы так, как на листе. Новых шагов для ровной картинки нет.</p>\n<h3>6. Reasoning и выбор модели</h3>\n<p>Где лист говорит, что модели нет, на схеме нет вызова модели. Где лист говорит, что порог спора не выбран, так и подписано.</p>", "tools": "<h3>7. Tool Execution</h3>\n<p>Инструменты перенесены с листа. Чтение отдельно от записи. Запись есть только там, где лист её называет.</p>", "hv": "<h3>8. Human Validation</h3>\n<p>Пауза стоит после того шага, где на листе человек останавливает цепочку. Если лист говорит, что фразу не утверждают или задачу создаёт человек, подпись это повторяет.</p>", "stress": "<h3>9. Stress testing и входные правила</h3>\n<p>Сценарии взяты из валидатора листа. Если валидатора на листе нет, блок закрыт причиной.</p>", "data_processing": "<h3>10. Data Processing</h3>\n<p>Подготовка, которую лист отделил от пути запроса, вынесена в нижний ряд. Если лист описывает один такой конвейер, на схеме один.</p>", "database": "<h3>11. Database Layer</h3>\n<p>Хранилища подписаны как на листе. Невыбранный движок и неописанная пауза остаются открытыми, а не закрытым цилиндром.</p>", "evaluation": "<h3>12. Evaluation</h3>\n<p>Цифры только те, что уже стоят на листе. Где порога нет, так и написано. Проверка не вставлена шагом в цепочку.</p>", "logs": "<h3>13. Логи и наблюдаемость</h3>\n<p>Журнал подписан формулировкой листа. Если контур журнала не подтверждён, схема это не закрывает.</p>"};
const svg = document.querySelector('.board svg');
const panel = document.getElementById('panel');
const idle = panel.innerHTML;
svg.querySelectorAll('.blk').forEach(g => {
  g.addEventListener('mouseenter', () => {
    const id = g.dataset.block;
    svg.classList.add('focus');
    svg.querySelectorAll('.blk').forEach(b => b.classList.toggle('on', b.dataset.block === id));
    svg.querySelectorAll('.edge').forEach(e => {
      const on = e.dataset.a === id || e.dataset.b === id;
      e.classList.toggle('on', on);
      if (on) svg.querySelectorAll('.blk').forEach(b => { if (b.dataset.block === e.dataset.a || b.dataset.block === e.dataset.b) b.classList.add('on'); });
    });
    panel.innerHTML = SECTIONS[id] || idle;
  });
});
svg.addEventListener('mouseleave', () => {
  svg.classList.remove('focus');
  svg.querySelectorAll('.on').forEach(e => e.classList.remove('on'));
  panel.innerHTML = idle;
});
</script></body></html>
