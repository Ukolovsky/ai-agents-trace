th d="M379.9,959.5 h40" stroke="#d9ab45" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#m-hv)"/><text x="429.9" y="963.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="429.9" dy="0">остановка на человеке</tspan></text><circle cx="595.2" cy="959.5" r="9" fill="#0c0e13" stroke="#cfd4df" stroke-width="1.5"/><text x="612.2" y="963.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="612.2" dy="0">шаг</tspan></text><polygon points="665.1,949.5 675.1,959.5 665.1,969.5 655.1,959.5" fill="#0c0e13" stroke="#d9ab45" stroke-width="1.5"/><text x="683.1" y="963.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="683.1" dy="0">развилка</tspan></text><rect x="759.4999999999999" y="953.5" width="3.5" height="12" fill="#d9ab45"/><rect x="765.9999999999999" y="953.5" width="3.5" height="12" fill="#d9ab45"/><text x="779.5" y="963.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="779.5" dy="0">пауза перед побочным эффектом</tspan></text><text x="986.1999999999998" y="963.5" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#3fbcb0">&gt;_</text><text x="1008.2" y="963.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="1008.2" dy="0">инструмент</tspan></text><path d="M1095.1999999999998,952.5 a10,4 0 0,0 20,0 v13 a10,4 0 0,1 -20,0 z" fill="none" stroke="#c65aa0" stroke-width="1.3"/><ellipse cx="1105.1999999999998" cy="952.5" rx="10" ry="4" fill="none" stroke="#c65aa0" stroke-width="1.3"/><text x="1123.2" y="963.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="1123.2" dy="0">хранилище</tspan></text><text x="24.0" y="997.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#e7e9ef" text-anchor="start"><tspan x="24.0" dy="0">Паттерн: канал окна, своей модели нет</tspan></text><text x="24.0" y="1018.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="24.0" dy="0">Отвергнуто: окно само подменяет галочку профиля</tspan></text><text x="24.0" y="1036.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="24.0" dy="0">Источники: текущий лист канона, agent_notation.py AI-07</tspan></text><text x="1696.0" y="1036.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="end"><tspan x="1696.0" dy="0">AI-07 · Magic Pad · версия 0.1-v2</tspan></text></svg></div>
<div class="panel" id="panel"><span class="hint">Наведите на блок схемы: подсветятся его связи, здесь появится описание блока из md.</span></div>

<script>
const SECTIONS = {"channel": "<h3>1. Канал (User Query)</h3>\n<p>Входы взяты с текущего листа и подписаны как на нём. Чего лист не называет, на схеме нет. Возврат ответа подписан так, как лист описывает канал этого агента, без добавленного маршрута.</p>", "gateway": "<h3>2. Gateway и Auth</h3>\n<p>Если на листе агента шлюз не назван, блок закрыт причиной и на рисунке его нет. Платформенный вход из общего канона на этот пробный лист не копировался, чтобы не дорисовать стрелку.</p>", "core": "<h3>3. Application Core</h3>\n<p>Кто хранит запись, взято с листа. Если агент в операционную базу не пишет, блок закрыт этой причиной, а не выдуманной записью.</p>", "runtime": "<h3>4. Agent Pattern и runtime</h3>\n<p>канал окна, своей модели нет. Владелец ответа пользователю: ответ в то же окно возвращает оркестратор.</p>\n<h3>5. Pipeline: шаги</h3>\n<p>Шаги листа, в том же составе: Фраза в оркестратор, Ответ в то же окно, Задание остановлено?, Модалка в том же окне. Линейность или цикл заданы так, как на листе. Новых шагов для ровной картинки нет.</p>\n<h3>6. Reasoning и выбор модели</h3>\n<p>Где лист говорит, что модели нет, на схеме нет вызова модели. Где лист говорит, что порог спора не выбран, так и подписано.</p>", "tools": "<h3>7. Tool Execution</h3>\n<p>Инструменты перенесены с листа. Чтение отдельно от записи. Запись есть только там, где лист её называет.</p>", "hv": "<h3>8. Human Validation</h3>\n<p>Пауза стоит после того шага, где на листе человек останавливает цепочку. Если лист говорит, что фразу не утверждают или задачу создаёт человек, подпись это повторяет.</p>", "stress": "<h3>9. Stress testing и входные правила</h3>\n<p>Сценарии взяты из валидатора листа. Если валидатора на листе нет, блок закрыт причиной.</p>", "data_processing": "<h3>10. Data Processing</h3>\n<p>Подготовка, которую лист отделил от пути запроса, вынесена в нижний ряд. Если лист описывает один такой конвейер, на схеме один.</p>", "database": "<h3>11. Database Layer</h3>\n<p>Хранилища подписаны как на листе. Невыбранный движок и неописанная пауза остаются открытыми, а не закрытым цилиндром.</p>", "evaluation": "<h3>12. Evaluation</h3>\n<p>Цифры только те, что уже стоят на листе. Где порога нет, так и написано. Проверка не вставлена шагом в цепочку.</p>", "logs": "<h3>13. Логи и наблюдаемость</h3>\n<p>Журнал подписан формулировкой листа. Если контур журнала не подтверждён, схема это не закрывает.</p>"};
const svg = document.querySelector('.board svg');
const panel = document.getElementById('panel');
const idle = panel.innerHTML;
svg.querySelectorAll('.blk').forEach(g => {
  g.addEventListener('mouseenter', () => {
    const id = g.dataset.block;
    svg.classList.add('focus');
    svg.querySelectorAll('.blk').forEach(b => b.classList.toggle('on', b.dataset.block === id));
    svg.querySelectorAll('.edge').forEach(e => {
      const on = e.dataset.a === id || e.dataset.b === id;
      e.classList.toggle('on', on);
      if (on) svg.querySelectorAll('.blk').forEach(b => { if (b.dataset.block === e.dataset.a || b.dataset.block === e.dataset.b) b.classList.add('on'); });
    });
    panel.innerHTML = SECTIONS[id] || idle;
  });
});
svg.addEventListener('mouseleave', () => {
  svg.classList.remove('focus');
  svg.querySelectorAll('.on').forEach(e => e.classList.remove('on'));
  panel.innerHTML = idle;
});
</script></body></html>
