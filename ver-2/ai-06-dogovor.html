lass="edge" data-a="tools" data-b="data_processing"><path d="M515.4,883.0 L515.4,899.0 L410.0,899.0 L410.0,960.0" fill="none" stroke="#cfd4df" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="416.0" y="933.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#939bad" text-anchor="start" stroke="#0c0e13" stroke-width="4" paint-order="stroke"><tspan x="416.0" dy="0">semantic_compare_clauses</tspan></text></g><g class="edge" data-a="tools" data-b="database"><path d="M865.3,883.0 L865.3,914.0 L1185.3,914.0 L1185.3,960.0" fill="none" stroke="#cfd4df" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="1025.3" y="910.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#939bad" text-anchor="middle" stroke="#0c0e13" stroke-width="4" paint-order="stroke"><tspan x="1025.3" dy="0">чтение</tspan></text></g><g class="edge" data-a="core" data-b="database"><path d="M1592.7,483.5 L1592.7,514.5 L1540.7,514.5 L1540.7,929.0 L1185.3,929.0 L1185.3,960.0" fill="none" stroke="#cfd4df" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="1363.0" y="925.0" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#939bad" text-anchor="middle" stroke="#0c0e13" stroke-width="4" paint-order="stroke"><tspan x="1363.0" dy="0">запись после подтверждения</tspan></text></g><text x="24.0" y="1178.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="24.0" dy="0">Не применяется:</tspan></text><g id="gateway" class="blk" data-block="gateway"><rect x="132.5" y="1161.5" width="334.3" height="24" rx="6" fill="none" stroke="#4fa8e0" stroke-opacity="0.7" stroke-dasharray="4 3"/><text x="142.5" y="1177.5" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="500" fill="#4fa8e0" text-anchor="start" letter-spacing="0.6"><tspan x="142.5" dy="0">GATEWAY</tspan></text><text x="198.8" y="1177.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="198.8" dy="0">на листе договора отдельный шлюз не назван</tspan></text></g><path d="M24,1221.5 h40" stroke="#cfd4df" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="74.0" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="74.0" dy="0">рабочий поток</tspan></text><path d="M179.89999999999998,1221.5 h40" stroke="#3fbcb0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-trace)"/><text x="229.9" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="229.9" dy="0">след, обратная связь</tspan></text><path d="M379.9,1221.5 h40" stroke="#e0585d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-attack)"/><text x="429.9" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="429.9" dy="0">атака, входные правила</tspan></text><path d="M592.5,1221.5 h40" stroke="#d9ab45" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#m-hv)"/><text x="642.5" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="642.5" dy="0">остановка на человеке</tspan></text><circle cx="807.8" cy="1221.5" r="9" fill="#0c0e13" stroke="#cfd4df" stroke-width="1.5"/><text x="824.8" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="824.8" dy="0">шаг</tspan></text><polygon points="877.7,1211.5 887.7,1221.5 877.7,1231.5 867.7,1221.5" fill="#0c0e13" stroke="#d9ab45" stroke-width="1.5"/><text x="895.7" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="895.7" dy="0">развилка</tspan></text><circle cx="981.0999999999999" cy="1221.5" r="7" fill="none" stroke="#cfd4df" stroke-width="1.5"/><circle cx="981.0999999999999" cy="1221.5" r="11" fill="none" stroke="#6f86f2" stroke-width="1.3" stroke-dasharray="3 2.5"/><text x="1000.1" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="1000.1" dy="0">шаг с моделью</tspan></text><rect x="1108.0" y="1215.5" width="3.5" height="12" fill="#d9ab45"/><rect x="1114.5" y="1215.5" width="3.5" height="12" fill="#d9ab45"/><text x="1128.0" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="1128.0" dy="0">пауза перед побочным эффектом</tspan></text><text x="1334.7" y="1225.5" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#3fbcb0">&gt;_</text><text x="1356.7" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="1356.7" dy="0">инструмент</tspan></text><path d="M1443.7,1214.5 a10,4 0 0,0 20,0 v13 a10,4 0 0,1 -20,0 z" fill="none" stroke="#c65aa0" stroke-width="1.3"/><ellipse cx="1453.7" cy="1214.5" rx="10" ry="4" fill="none" stroke="#c65aa0" stroke-width="1.3"/><text x="1471.7" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="1471.7" dy="0">хранилище</tspan></text><rect x="1552.4" y="1211.5" width="34" height="20" rx="5" fill="none" stroke="#939bad" stroke-dasharray="3 3"/><text x="1594.4" y="1225.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ef" text-anchor="start"><tspan x="1594.4" dy="0">внешнее / не выбрано</tspan></text><text x="24.0" y="1259.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#e7e9ef" text-anchor="start"><tspan x="24.0" dy="0">Паттерн: один runtime, сверка пунктов договора</tspan></text><text x="24.0" y="1280.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="24.0" dy="0">Отвергнуто: экспорт пункта без цитаты и отправка без модалки</tspan></text><text x="24.0" y="1298.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="start"><tspan x="24.0" dy="0">Источники: текущий лист канона, agent_notation.py AI-06</tspan></text><text x="1786.7" y="1298.5" font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#939bad" text-anchor="end"><tspan x="1786.7" dy="0">AI-06 · Договор · версия 0.1-v2</tspan></text></svg></div>
<div class="panel" id="panel"><span class="hint">Наведите на блок схемы: подсветятся его связи, здесь появится описание блока из md.</span></div>
</div>
<script>
const SECTIONS = {"channel": "<h3>1. Канал (User Query)</h3>\n<p>Входы взяты с текущего листа и подписаны как на нём. Чего лист не называет, на схеме нет. Возврат ответа подписан так, как лист описывает канал этого агента, без добавленного маршрута.</p>", "gateway": "<h3>2. Gateway и Auth</h3>\n<p>Если на листе агента шлюз не назван, блок закрыт причиной и на рисунке его нет. Платформенный вход из общего канона на этот пробный лист не копировался, чтобы не дорисовать стрелку.</p>", "core": "<h3>3. Application Core</h3>\n<p>Кто хранит запись, взято с листа. Если агент в операционную базу не пишет, блок закрыт этой причиной, а не выдуманной записью.</p>", "runtime": "<h3>4. Agent Pattern и runtime</h3>\n<p>один runtime, сверка пунктов договора. Владелец ответа пользователю: наружу документ уходит только после отдельной модалки.</p>\n<h3>5. Pipeline: шаги</h3>\n<p>Шаги листа, в том же составе: Классификация, Тип уверен?, Эталон компании, Сравнение пунктов, Протокол, Экспорт. Линейность или цикл заданы так, как на листе. Новых шагов для ровной картинки нет.</p>\n<h3>6. Reasoning и выбор модели</h3>\n<p>Где лист говорит, что модели нет, на схеме нет вызова модели. Где лист говорит, что порог спора не выбран, так и подписано.</p>", "tools": "<h3>7. Tool Execution</h3>\n<p>Инструменты перенесены с листа. Чтение отдельно от записи. Запись есть только там, где лист её называет.</p>", "hv": "<h3>8. Human Validation</h3>\n<p>Пауза стоит после того шага, где на листе человек останавливает цепочку. Если лист говорит, что фразу не утверждают или задачу создаёт человек, подпись это повторяет.</p>", "stress": "<h3>9. Stress testing и входные правила</h3>\n<p>Сценарии взяты из валидатора листа. Если валидатора на листе нет, блок закрыт причиной.</p>", "data_processing": "<h3>10. Data Processing</h3>\n<p>Подготовка, которую лист отделил от пути запроса, вынесена в нижний ряд. Если лист описывает один такой конвейер, на схеме один.</p>", "database": "<h3>11. Database Layer</h3>\n<p>Хранилища подписаны как на листе. Невыбранный движок и неописанная пауза остаются открытыми, а не закрытым цилиндром.</p>", "evaluation": "<h3>12. Evaluation</h3>\n<p>Цифры только те, что уже стоят на листе. Где порога нет, так и написано. Проверка не вставлена шагом в цепочку.</p>", "logs": "<h3>13. Логи и наблюдаемость</h3>\n<p>Журнал подписан формулировкой листа. Если контур журнала не подтверждён, схема это не закрывает.</p>", "etalon": "<h3>1. Канал (User Query)</h3>\n<p>Входы взяты с текущего листа и подписаны как на нём. Чего лист не называет, на схеме нет. Возврат ответа подписан так, как лист описывает канал этого агента, без добавленного маршрута.</p>"};
const svg = document.querySelector('.board svg');
const panel = document.getElementById('panel');
const idle = panel.innerHTML;
svg.querySelectorAll('.blk').forEach(g => {
  g.addEventListener('mouseenter', () => {
    const id = g.dataset.block;
    svg.classList.add('focus');
    svg.querySelectorAll('.blk').forEach(b => b.classList.toggle('on', b.dataset.block === id));
    svg.querySelectorAll('.edge').forEach(e => {
      const on = e.dataset.a === id || e.dataset.b === id;
      e.classList.toggle('on', on);
      if (on) svg.querySelectorAll('.blk').forEach(b => { if (b.dataset.block === e.dataset.a || b.dataset.block === e.dataset.b) b.classList.add('on'); });
    });
    panel.innerHTML = SECTIONS[id] || idle;
  });
});
svg.addEventListener('mouseleave', () => {
  svg.classList.remove('focus');
  svg.querySelectorAll('.on').forEach(e => e.classList.remove('on'));
  panel.innerHTML = idle;
});
</script></body></html>
