const SECTIONS = {"channel": "<h3>1. Канал (User Query)</h3>\n<p>Входы взяты с текущего листа и подписаны как на нём. Чего лист не называет, на схеме нет. Возврат ответа подписан так, как лист описывает канал этого агента, без добавленного маршрута.</p>", "gateway": "<h3>2. Gateway и Auth</h3>\n<p>Если на листе агента шлюз не назван, блок закрыт причиной и на рисунке его нет. Платформенный вход из общего канона на этот пробный лист не копировался, чтобы не дорисовать стрелку.</p>", "core": "<h3>3. Application Core</h3>\n<p>Кто хранит запись, взято с листа. Если агент в операционную базу не пишет, блок закрыт этой причиной, а не выдуманной записью.</p>", "runtime": "<h3>4. Agent Pattern и runtime</h3>\n<p>поиск и цитаты, каскада моделей нет. Владелец ответа пользователю: строку результата выбирает человек.</p>\n<h3>5. Pipeline: шаги</h3>\n<p>Шаги листа, в том же составе: Фрагменты, Связи сущности, Повторная сортировка, Ответ с цитатами, Выбор строки. Линейность или цикл заданы так, как на листе. Новых шагов для ровной картинки нет.</p>\n<h3>6. Reasoning и выбор модели</h3>\n<p>Где лист говорит, что модели нет, на схеме нет вызова модели. Где лист говорит, что порог спора не выбран, так и подписано.</p>", "tools": "<h3>7. Tool Execution</h3>\n<p>Инструменты перенесены с листа. Чтение отдельно от записи. Запись есть только там, где лист её называет.</p>", "hv": "<h3>8. Human Validation</h3>\n<p>Пауза стоит после того шага, где на листе человек останавливает цепочку. Если лист говорит, что фразу не утверждают или задачу создаёт человек, подпись это повторяет.</p>", "stress": "<h3>9. Stress testing и входные правила</h3>\n<p>Сценарии взяты из валидатора листа. Если валидатора на листе нет, блок закрыт причиной.</p>", "data_processing": "<h3>10. Data Processing</h3>\n<p>Подготовка, которую лист отделил от пути запроса, вынесена в нижний ряд. Если лист описывает один такой конвейер, на схеме один.</p>", "database": "<h3>11. Database Layer</h3>\n<p>Хранилища подписаны как на листе. Невыбранный движок и неописанная пауза остаются открытыми, а не закрытым цилиндром.</p>", "evaluation": "<h3>12. Evaluation</h3>\n<p>Цифры только те, что уже стоят на листе. Где порога нет, так и написано. Проверка не вставлена шагом в цепочку.</p>", "logs": "<h3>13. Логи и наблюдаемость</h3>\n<p>Журнал подписан формулировкой листа. Если контур журнала не подтверждён, схема это не закрывает.</p>"};
const svg = document.querySelector('.board svg');
const panel = document.getElementById('panel');
const idle = panel.innerHTML;
svg.querySelectorAll('.blk').forEach(g => {
  g.addEventListener('mouseenter', () => {
    const id = g.dataset.block;
    svg.classList.add('focus');
    svg.querySelectorAll('.blk').forEach(b => b.classList.toggle('on', b.dataset.block === id));
    svg.querySelectorAll('.edge').forEach(e => {
      const on = e.dataset.a === id || e.dataset.b === id;
      e.classList.toggle('on', on);
      if (on) svg.querySelectorAll('.blk').forEach(b => { if (b.dataset.block === e.dataset.a || b.dataset.block === e.dataset.b) b.classList.add('on'); });
    });
    panel.innerHTML = SECTIONS[id] || idle;
  });
});
svg.addEventListener('mouseleave', () => {
  svg.classList.remove('focus');
  svg.querySelectorAll('.on').forEach(e => e.classList.remove('on'));
  panel.innerHTML = idle;
});
</script></body></html>
